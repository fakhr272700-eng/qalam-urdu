<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qalam — Roman to Urdu Script Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10152B; --surface:#171E3D; --surface2:#1E2650; --line:#2D3768;
    --text:#F2EFE6; --muted:#9098C2; --gold:#D4AF37; --gold-soft:rgba(212,175,55,0.14);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F5F4EF; --surface:#FFFFFF; --surface2:#FAF8F2;
      --line:#E4E0D0; --text:#181A2A; --muted:#6B6F91; --gold-soft:rgba(212,175,55,0.10);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Manrope',sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{max-width:760px; margin:0 auto; padding:32px 20px 60px;}

  header{margin-bottom:26px;}
  .eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--gold),#f0d878); display:flex; align-items:center; justify-content:center; font-family:'Noto Nastaliq Urdu'; font-weight:700; color:#1a1400; font-size:19px;}
  h1{font-size:20px; font-weight:800;}
  .tagline{color:var(--muted); font-size:13.5px; margin-top:2px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px;}
  .card-label{color:var(--muted); font-size:12.5px; margin-bottom:10px; display:flex; justify-content:space-between;}

  textarea{
    width:100%; min-height:120px; background:var(--surface2); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px; color:var(--text); font-family:'Manrope';
    font-size:16px; resize:vertical; outline:none;
  }
  textarea:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
  textarea::placeholder{color:var(--muted);}

  .output-box{
    width:100%; min-height:120px; background:var(--surface2); border:1px solid var(--line);
    border-radius:14px; padding:18px 20px; font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',Tahoma,Arial,sans-serif;
    font-size:26px; line-height:2.1; direction:rtl; text-align:right; color:var(--text);
    white-space:pre-wrap; word-break:break-word;
  }
  .output-box.empty{color:var(--muted); font-size:16px; font-family:'Manrope'; line-height:1.6;}

  .actions{display:flex; gap:10px; margin-top:12px;}
  .btn{
    border:none; border-radius:10px; padding:10px 18px; font-family:'Manrope'; font-weight:700;
    font-size:13.5px; cursor:pointer; transition:transform .15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--gold); color:#1a1400;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .examples{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .chip{
    background:var(--gold-soft); border:1px solid var(--line); color:var(--text);
    border-radius:20px; padding:7px 14px; font-size:12.5px; cursor:pointer; font-family:'Manrope';
  }
  .chip:hover{border-color:var(--gold);}

  .note{color:var(--muted); font-size:12px; line-height:1.6; padding:2px 4px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow-row">
      <div class="mark">اُ</div>
      <div>
        <h1>Qalam</h1>
      </div>
    </div>
    <div class="tagline">Type Roman Urdu, get instant Urdu script</div>
  </header>

  <div class="card">
    <div class="card-label"><span>Roman Urdu</span></div>
    <textarea id="input" placeholder="Type here... e.g. aap kaisay hain, mein theek hoon"></textarea>
    <div class="actions">
      <button class="btn btn-primary" id="clear">Clear</button>
      <button class="btn btn-ghost" id="copy">Copy Urdu</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label"><span>Urdu Script</span></div>
    <div class="output-box empty" id="output">Your converted Urdu text will appear here</div>
  </div>

  <div class="card">
    <div class="card-label"><span>Quick Examples</span></div>
    <div class="examples" id="examples"></div>
  </div>

  <div class="note">This is an automatic phonetic converter — most common words convert correctly, but some complex or rare words may need manual correction.</div>

</div>

<script>
const dict = {
  "mein":"میں","main":"میں","hai":"ہے","hain":"ہیں","tha":"تھا","thi":"تھی","thay":"تھے",
  "ho":"ہو","hoon":"ہوں","hun":"ہوں","kya":"کیا","kia":"کیا","kiya":"کیا","kaisay":"کیسے","kaise":"کیسے","kyun":"کیوں",
  "kyon":"کیوں","kahan":"کہاں","kaha":"کہا","kab":"کب","kaun":"کون","kis":"کس","kisi":"کسی",
  "koi":"کوئی","kuch":"کچھ","sab":"سب","ye":"یہ","yeh":"یہ","wo":"وہ","woh":"وہ","hum":"ہم",
  "tum":"تم","aap":"آپ","mera":"میرا","meri":"میری","mere":"میرے","tera":"تیرا","teri":"تیری",
  "tere":"تیرے","uska":"اس کا","uski":"اس کی","uske":"اس کے","hamara":"ہمارا","hamari":"ہماری",
  "tumhara":"تمہارا","tumhari":"تمہاری","nahi":"نہیں","nahin":"نہیں","haan":"ہاں","han":"ہاں",
  "ji":"جی","acha":"اچھا","accha":"اچھا","theek":"ٹھیک","thik":"ٹھیک","bhai":"بھائی",
  "behen":"بہن","behan":"بہن","dost":"دوست","ghar":"گھر","pani":"پانی","paani":"پانی",
  "khana":"کھانا","roti":"روٹی","subah":"صبح","shaam":"شام","raat":"رات","din":"دن",
  "pyaar":"پیار","pyar":"پیار","dil":"دل","zindagi":"زندگی","mohabbat":"محبت",
  "shukriya":"شکریہ","shukria":"شکریہ","maaf":"معاف","maafi":"معافی","madad":"مدد",
  "sath":"ساتھ","saath":"ساتھ","bahut":"بہت","bohat":"بہت","zyada":"زیادہ","thora":"تھوڑا",
  "thoda":"تھوڑا","zaroor":"ضرور","zarur":"ضرور","inshallah":"ان شاء اللہ",
  "mashallah":"ما شاء اللہ","alhamdulillah":"الحمد للہ","allah":"اللہ","khuda":"خدا",
  "salam":"سلام","kaam":"کام","log":"لوگ","insaan":"انسان","duniya":"دنیا","waqt":"وقت",
  "umeed":"امید","khushi":"خوشی","gham":"غم","dosti":"دوستی","please":"پلیز","time":"ٹائم",
  "karna":"کرنا","karo":"کرو","dena":"دینا","lena":"لینا","liya":"لیا","jana":"جانا",
  "gaya":"گیا","gayi":"گئی","gaye":"گئے","aana":"آنا","aya":"آیا","ayi":"آئی","aye":"آئے",
  "dekh":"دیکھ","dekha":"دیکھا","dekhna":"دیکھنا","suna":"سنا","sunna":"سننا","bolna":"بولنا",
  "bola":"بولا","kehna":"کہنا","baap":"باپ","walid":"والد","amma":"اماں","ami":"امی","abu":"ابو",
  "bhabhi":"بھابھی","chacha":"چچا","mamu":"ماموں","khala":"خالہ","phupo":"پھوپھو",
  "aaj":"آج","kal":"کل","parso":"پرسوں","abhi":"ابھی","phir":"پھر","baad":"بعد","pehle":"پہلے",
  "bara":"بڑا","chota":"چھوٹا","bura":"برا","khoobsurat":"خوبصورت","khubsurat":"خوبصورت",
  "khush":"خوش","udaas":"اداس","pareshan":"پریشان","gussa":"غصہ",
  "aur":"اور","ya":"یا","lekin":"لیکن","magar":"مگر","kyunke":"کیونکہ","kyunki":"کیونکہ",
  "agar":"اگر","warna":"ورنہ","hafiz":"حافظ","alaikum":"علیکم","assalamualaikum":"السلام علیکم",
  "practical":"پریکٹیکل","phone":"فون","mobile":"موبائل","internet":"انٹرنیٹ","school":"سکول",
  "college":"کالج","university":"یونیورسٹی","doctor":"ڈاکٹر","engineer":"انجینئر",
  "computer":"کمپیوٹر","laptop":"لیپ ٹاپ","table":"ٹیبل","office":"آفس","job":"جاب",
  "business":"بزنس","company":"کمپنی","market":"مارکیٹ","road":"روڈ","car":"کار","bike":"بائیک",
  "ticket":"ٹکٹ","hotel":"ہوٹل","restaurant":"ریسٹورنٹ","hospital":"ہسپتال","teacher":"ٹیچر",
  "student":"سٹوڈنٹ","class":"کلاس","subject":"سبجیکٹ","problem":"پرابلم","solution":"سولوشن",
  "idea":"آئیڈیا","website":"ویب سائٹ","application":"ایپلیکیشن","download":"ڈاؤن لوڈ",
  "upload":"اپ لوڈ","message":"میسج","email":"ای میل","password":"پاس ورڈ","account":"اکاؤنٹ",
  "bank":"بینک","dollar":"ڈالر","minute":"منٹ","second":"سیکنڈ","system":"سسٹم","network":"نیٹ ورک",
  "video":"ویڈیو","photo":"فوٹو","camera":"کیمرہ","game":"گیم","result":"رزلٹ","exam":"امتحان",
  "study":"سٹڈی","project":"پروجیکٹ","team":"ٹیم","group":"گروپ","friend":"فرینڈ","family":"فیملی",
  "ka":"کا","ki":"کی","ke":"کے","ko":"کو","se":"سے","per":"پر","tak":"تک","liye":"لیے",
  "is":"اس","us":"اس","karta":"کرتا","karti":"کرتی","karte":"کرتے","raha":"رہا","rahi":"رہی",
  "rahe":"رہے","wala":"والا","wali":"والی","wale":"والے","hoga":"ہوگا","hogi":"ہوگی","honge":"ہوں گے",
  "bhara":"بھرا","bhari":"بھری","bhare":"بھرے","khushiyon":"خوشیوں","gham":"غم","aansu":"آنسو",
  "muskurahat":"مسکراہٹ","hansi":"ہنسی","rona":"رونا","hasna":"ہنسنا","zindagi":"زندگی",
  "safar":"سفر","manzil":"منزل","raasta":"راستہ","umeedwar":"امیدوار","kamyaab":"کامیاب",
  "kamyabi":"کامیابی","mushkil":"مشکل","aasan":"آسان","behtareen":"بہترین","umda":"عمدہ",
  "mujhe":"مجھے","tujhe":"تجھے","unhe":"انہیں","hamein":"ہمیں","humein":"ہمیں","tumhein":"تمہیں",
  "mila":"ملا","mile":"ملے","milay":"ملے","mili":"ملی","milna":"ملنا",
  "chahiye":"چاہیے","chahta":"چاہتا","chahti":"چاہتی","chahte":"چاہتے",
  "samajh":"سمجھ","samjha":"سمجھا","samjhi":"سمجھی","samjhe":"سمجھے","mujh":"مجھ","ap":"آپ",
  "tumhe":"تمہیں","zahid":"زاہد"
};

const phrases = {
  "assalam o alaikum":"السلام علیکم","assalam alaikum":"السلام علیکم",
  "walaikum assalam":"علیکم السلام","khuda hafiz":"خدا حافظ","allah hafiz":"اللہ حافظ",
  "kya haal hai":"کیا حال ہے","kya haal hain":"کیا حال ہیں","in sha allah":"ان شاء اللہ",
  "masha allah":"ماشاءاللہ","jazak allah":"جزاک اللہ","jazakallah":"جزاک اللہ",
  "aap kaisay hain":"آپ کیسے ہیں","aap kaise hain":"آپ کیسے ہیں",
  "zindagi khushiyon se bhari ho":"زندگی خوشیوں سے بھری ہو"
};
function applyPhrases(text){
  const keys = Object.keys(phrases).sort((a,b)=> b.split(' ').length - a.split(' ').length);
  for(const k of keys){
    const re = new RegExp('\\b'+k.replace(/ /g,'\\s+')+'\\b','gi');
    text = text.replace(re, phrases[k]);
  }
  return text;
}

const multi = [
  ["kh","خ"],["gh","غ"],["sh","ش"],["ch","چ"],["th","تھ"],["dh","دھ"],
  ["bh","بھ"],["ph","پھ"],["zh","ژ"],["aa","آ"],["ee","ی"],["oo","او"],
  ["ai","ے"],["au","او"]
];
const single = {
  a:"ا",b:"ب",c:"ک",d:"د",e:"ے",f:"ف",g:"گ",h:"ہ",i:"ی",j:"ج",k:"ک",l:"ل",
  m:"م",n:"ن",o:"و",p:"پ",q:"ق",r:"ر",s:"س",t:"ت",u:"و",v:"و",w:"و",x:"اکس",y:"ی",z:"ز"
};

function phonetic(word){
  let out=""; let i=0; const lw=word.toLowerCase();
  while(i<lw.length){
    let matched=false;
    for(const [seq,rep] of multi){
      if(lw.startsWith(seq,i)){ out+=rep; i+=seq.length; matched=true; break; }
    }
    if(matched) continue;
    const ch=lw[i];
    out += single[ch] !== undefined ? single[ch] : ch;
    i++;
  }
  return out;
}

function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]
        : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}
const dictKeys = Object.keys(dict);
function fuzzyLookup(word){
  if(word.length<4) return null; // too short/risky to guess reliably
  const threshold = word.length<=5 ? 1 : 2;
  let best=null, bestDist=Infinity;
  for(const key of dictKeys){
    if(Math.abs(key.length-word.length) > threshold) continue;
    const d = levenshtein(word,key);
    if(d<bestDist){ bestDist=d; best=key; if(d===0) break; }
  }
  return bestDist<=threshold ? dict[best] : null;
}

function convert(text){
  text = applyPhrases(text);
  return text.replace(/[A-Za-z]+/g, (word)=>{
    const lw = word.toLowerCase();
    if(dict[lw] !== undefined) return dict[lw];
    const fuzzy = fuzzyLookup(lw);
    if(fuzzy !== null) return fuzzy;
    return phonetic(word);
  });
}

const input = document.getElementById('input');
const output = document.getElementById('output');

function update(){
  const val = input.value;
  if(!val.trim()){
    output.textContent = "Your converted Urdu text will appear here";
    output.classList.add('empty');
    return;
  }
  let converted;
  try{
    converted = convert(val);
  }catch(e){
    converted = val; // fail-safe: never leave the box blank
  }
  output.textContent = converted;
  output.classList.remove('empty');
}
input.addEventListener('input', update);

document.getElementById('clear').addEventListener('click', ()=>{
  input.value=""; update(); input.focus();
});
document.getElementById('copy').addEventListener('click', async ()=>{
  const btn = document.getElementById('copy');
  try{
    await navigator.clipboard.writeText(output.textContent==="Convert hoa text yahan nazar aayega" ? "" : output.textContent);
    const old = btn.textContent; btn.textContent="Copied!";
    setTimeout(()=>btn.textContent=old, 1200);
  }catch(e){}
});

const examplePhrases = [
  "aap kaisay hain","mein theek hoon","bahut shukriya","allah hafiz",
  "kya haal hai","mujhe pyaar hai","zindagi khushiyon se bhari ho"
];
const exWrap = document.getElementById('examples');
examplePhrases.forEach(p=>{
  const chip=document.createElement('div');
  chip.className='chip'; chip.textContent=p;
  chip.addEventListener('click', ()=>{ input.value=p; update(); });
  exWrap.appendChild(chip);
});
</script>
</body>
</html>
